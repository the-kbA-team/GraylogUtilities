name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  composer:
    name: Composer config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer validate --strict

  php:
    name: "PHP ${{ matrix.php-version }} (${{ matrix.dependencies }}) - lint, PHPUnit, PHPStan"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
        dependencies: [default]
        include:
          - php-version: "7.4"
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
      - name: Install default dependencies
        if: matrix.dependencies == 'default'
        run: make install PHP_VERSION=${{ matrix.php-version }}
      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: make install PHP_VERSION=${{ matrix.php-version }} DEPENDENCIES_LOWEST=1
      - name: Audit dependencies
        if: matrix.php-version == '7.4'
        run: make audit
      - run: make lint
      - run: make test
      - run: make analyze
